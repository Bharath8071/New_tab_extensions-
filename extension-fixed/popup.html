<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:220px;background:#292a2d;color:#e8eaed;font-family:'Google Sans',Roboto,Arial,sans-serif;padding:14px}
h2{font-size:13px;font-weight:600;margin-bottom:5px}
p{font-size:11px;color:#9aa0a6;line-height:1.5;margin-bottom:10px}
.row{display:flex;align-items:center;gap:8px;background:#3c4043;border-radius:8px;padding:9px 12px;margin-bottom:8px;font-size:11px;color:#bdc1c6}
.dot{width:7px;height:7px;border-radius:50%;background:#34a853;flex-shrink:0}
button{width:100%;padding:8px;background:#ea4335;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:12px;font-family:inherit}
button:hover{background:#c5221f}
</style>
</head>
<body>
<h2>Shortcuts</h2>
<p>Up to 20 shortcuts on the New Tab page, in one editable grid.</p>
<div class="row"><div class="dot"></div><span>Active · <span id="c">–</span> shortcuts</span></div>
<p>Hover any tile → click ⋮ to edit or remove.</p>
<button id="r">Reset all shortcuts to defaults</button>
<script src="popup.js"></script>
</body>
</html>
