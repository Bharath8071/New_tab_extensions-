<!DOCTYPE html>
<html lang="en">

<head>
  <style>
    @font-face {
      font-family: 'Google Sans';
      src: url('fonts/google-sans-v67-latin-regular.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'Google Sans';
      src: url('fonts/google-sans-v67-latin-500.woff2') format('woff2');
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'Google Sans';
      src: url('fonts/google-sans-v67-latin-600.woff2') format('woff2');
      font-weight: 600;
      font-style: normal;
      font-display: swap;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      padding: 0;
      background: #202124;
    }
  </style>
  <script src="fastpaint.js"></script>
  <meta name="theme-color" content="#202124">
  <meta name="color-scheme" content="dark">
  <meta charset="UTF-8" />
  <title>New Tab</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    :root {
      --bg-color: #202124;
      --tile-hover: rgba(255, 255, 255, 0.10);
      --label-color: #e8eaed;
      --circle-bg: rgba(60, 64, 67, 0.85);
      --divider: rgba(255, 255, 255, 0.12);
      /* Stacking order (low → high). Autocomplete is portaled to body. */
      --layer-wallpaper: 0;
      --layer-main: 1;
      --layer-cust-btn: 200;
      --layer-cust-panel: 500;
      --layer-autocomplete: 300;
      --layer-modal: 9999;
      --layer-wp-editor: 10000;
      --layer-dnd-ghost: 10001;
    }

    html {
      min-height: 100%;
    }

    body {
      min-height: 100%;
      background: transparent;
      font-family: 'Google Sans', Roboto, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    /* ── Universal background layer (solid colors + wallpapers) ── */
    #bg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background-color: var(--bg-color);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      z-index: var(--layer-wallpaper);
      pointer-events: none;
      opacity: 0;
      transform: scale(1.015);
      transition: opacity 220ms cubic-bezier(0.22, 1, 0.36, 1), transform 520ms cubic-bezier(0.22, 1, 0.36, 1);
      will-change: opacity, transform;
    }

    body.loaded #bg {
      opacity: 1;
      transform: scale(1);
    }

    #main {
      position: relative;
      z-index: var(--layer-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 165px;
      width: 100%;
      padding-bottom: 60px;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 0.25s ease, transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), padding-top 0s ease, background 0s;
    }

    body.loaded #main {
      opacity: 1;
      transform: translateY(0);
    }

    /* ── Logo ── */
    #logo {
      width: 272px;
      height: 92px;
      margin-bottom: 38px;
    }

    /* ── Search ── */
    #search-wrap {
      position: relative;
      z-index: 2;
      width: 584px;
      max-width: 92vw;
      margin-bottom: 20px;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.42s ease, transform 0.42s cubic-bezier(0.16, 1, 0.3, 1);
      transition-delay: 0.14s;
    }

    body.loaded #search-wrap {
      opacity: 1;
      transform: translateY(0);
    }

    #search-bar {
      height: 48px;
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      background: rgba(32, 33, 36, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 24px;
      padding: 0 52px;
      font-size: 16px;
      color: #e8eaed;
      outline: none;
      transition: background .2s, box-shadow .2s;
    }

    #search-bar::placeholder {
      color: #9aa0a6
    }

    #search-bar:focus {
      background: rgba(32, 33, 36, 0.25);
      box-shadow: 0 2px 18px rgba(0, 0, 0, .45)
    }

    /* .s-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:20px;height:22px;opacity:.65} */
    .s-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      width: 22px;
      height: 22px;
      opacity: 0.5;
      z-index: 2;
    }

    .s-icon path {
      stroke: #e8eaed;
    }

    #search-wrap:hover .s-icon {
      opacity: 1;
    }

    .m-icon {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 22px;
      height: 22px;
      cursor: pointer;
      opacity: .55
    }



    /* ── Shortcuts wrapper ── */
    .sc-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      gap: 0;
    }

    .sc-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-start;
      max-width: 950px;
      width: 100%;
      gap: 0;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.42s ease, transform 0.42s cubic-bezier(0.16, 1, 0.3, 1);
      transition-delay: 0.22s;
    }

    body.loaded .sc-grid {
      opacity: 1;
      transform: translateY(0);
    }

    /* ── Tile ── */
    .sc-tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 88px;
      padding: 8px 4px 6px;
      border-radius: 14px;
      position: relative;
      transition: background .15s;
      opacity: 0;
      transform: translateY(10px);
      animation: tile-appear 0.38s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: calc(var(--tile-index, 0) * 0.03s);
    }

    body.loaded .sc-tile {
      opacity: 1;
      transform: translateY(0);
    }

    .sc-tile:hover {
      background: var(--tile-hover);
    }

    @keyframes tile-appear {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* icon link */
    .sc-icon-link {
      display: block;
      text-decoration: none;
      position: relative;
    }

    .sc-circle {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--circle-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: transform .15s, box-shadow .15s;
      box-shadow:
        0 4px 10px rgba(0, 0, 0, 0.5),
        inset 0 0 6px rgba(255, 255, 255, 0.05);
    }

    .sc-tile:hover .sc-circle {
      transform: scale(1.07);
      box-shadow: 0 4px 14px rgba(0, 0, 0, .4);
    }

    .sc-circle img {
      width: 28px;
      height: 28px;
      object-fit: contain;
    }

    .sc-initial {
      font-size: 20px;
      font-weight: 600;
      color: #fff;
    }

    /* three-dot button */
    .sc-menu-btn {
      position: absolute;
      top: -4px;
      right: -10px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: rgba(60, 64, 67, 0.92);
      border: none;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 0;
      transition: background .15s;
      z-index: 10;
    }

    .sc-tile:hover .sc-menu-btn {
      display: flex;
    }

    .sc-menu-btn:hover {
      background: #5f6368;
    }

    .sc-menu-btn svg {
      pointer-events: none;
    }

    /* dropdown */
    .sc-dropdown {
      position: absolute;
      top: 14px;
      right: -4px;
      background: #3c4043;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, .5);
      min-width: 140px;
      z-index: 100;
      display: none;
      flex-direction: column;
      overflow: hidden;
    }

    .sc-dropdown.open {
      display: flex;
    }

    .sc-dd-item {
      padding: 10px 16px;
      font-size: 13px;
      color: #e8eaed;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: background .12s;
      border: none;
      background: none;
      text-align: left;
      font-family: inherit;
      width: 100%;
    }

    .sc-dd-item:hover {
      background: rgba(255, 255, 255, .1);
    }

    .sc-dd-item svg {
      flex-shrink: 0;
      opacity: .75;
    }

    /* label */
    .sc-label {
      margin-top: 6px;
      font-size: 12px;
      color: var(--label-color);
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 82px;
      text-shadow: 0 1px 3px rgba(0, 0, 0, .55);
    }

    /* add tile */
    .sc-add-tile {
      cursor: pointer;
    }

    .sc-add-circle {
      background: rgba(255, 255, 255, .1) !important;
      border: 2px dashed rgba(255, 255, 255, .35);
      transition: background .15s, border-color .15s;
    }

    .sc-add-tile:hover .sc-add-circle {
      background: rgba(255, 255, 255, .18) !important;
      border-color: rgba(255, 255, 255, .65);
    }

    .sc-plus {
      font-size: 26px;
      color: rgba(255, 255, 255, .7);
      font-weight: 300;
      line-height: 1;
    }

    /* ── Customize button (bottom right) ── */
    #cust-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      /* background:rgba(32,33,36,.88); */
      background: var(--circle-bg);
      border: 1px solid rgba(255, 255, 255, .18);
      border-radius: 30px;
      padding: 13px 13px;
      color: #e8eaed;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      backdrop-filter: blur(8px);
      transition: background .15s, box-shadow .15s;
      z-index: var(--layer-cust-btn);
    }

    #cust-btn:hover {
      background: rgba(60, 64, 67, .97);
      box-shadow: 0 2px 12px rgba(0, 0, 0, .4);
    }

    /* ── Customize panel ── */
    #cust-panel {
      position: fixed;
      right: 0;
      top: 0;
      bottom: 0;
      backdrop-filter: blur(4px);
      width: 320px;
      /* background:rgba(41,42,45,0.85); */
      background: rgba(32, 33, 36, 0.3);
      box-shadow: -4px 0 24px rgba(0, 0, 0, .5);
      z-index: var(--layer-cust-panel);
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform .25s cubic-bezier(.4, 0, .2, 1);
      overflow-y: auto;
      will-change: transform;
      --cp-text-shadow: 0 1px 2px rgba(0, 0, 0, .8), 0 0 8px rgba(0, 0, 0, .15);
      --cp-icon-shadow: drop-shadow(0 1px 2px rgba(0, 0, 0, .8)) drop-shadow(0 0 4px rgba(0, 0, 0, .15));
    }

    #cust-panel::-webkit-scrollbar {
      width: 6px;
    }

    #cust-panel::-webkit-scrollbar-track {
      background: transparent;
    }

    #cust-panel::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 3px;
    }

    #cust-panel::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.28);
    }

    #cust-panel.open {
      transform: translateX(0);
    }

    .cp-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 20px 12px;
      border-bottom: 1px solid rgba(255, 255, 255, .3);
    }

    .cp-title {
      font-size: 16px;
      font-weight: 600;
      color: #e8eaed;
      line-height: 1.25;
      text-shadow: var(--cp-text-shadow);
    }

    .cp-close {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: none;
      border: none;
      cursor: pointer;
      color: #e8eaed;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .15s, color .15s;
    }

    .cp-close:hover {
      background: rgba(255, 255, 255, .1);
      color: #fff;
    }

    .cp-section {
      position: relative;
      padding: 16px 20px;
    }

    .cp-section::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 20px;
      right: 20px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .2), transparent);
    }

    .cp-section-title {
      font-size: 12px;
      font-weight: 600;
      color: #e8eaed;
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-bottom: 12px;
      text-shadow: var(--cp-text-shadow);
    }

    /* Text shadows for readable panel text */
    #cust-panel button,
    .cp-brightness-control span {
      text-shadow: var(--cp-text-shadow);
    }

    /* Matching shadow for icon glyphs */
    .cp-nav-label svg {
    filter:
        drop-shadow(0 0 4px rgba(0, 0, 0, .20))
        drop-shadow(0 1px 2px rgba(0, 0, 0, .3));
}

    /* ── Settings entry row + settings sub-view ── */
    .cp-nav-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      background: none;
      border: none;
      cursor: pointer;
      padding: 2px 0;
      font-family: inherit;
      /* color: #e8eaed;   */
      font-size: 14px;
    }

    #cp-open-settings .cp-nav-label svg {
      transition: transform .3s cubic-bezier(.2, .8, .2, 1);
    }

    #cp-open-settings:hover .cp-nav-label svg {
      transform: rotate(24deg);
    }

    #cp-open-settings .cp-nav-label > span {
      color: #e8eaed;
      transition: color .2s, transform .2s;
    }

    #cp-open-settings:hover .cp-nav-label > span {
      color: #fff;
      transform: translateX(1px);
    }

    .cp-nav-label {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .cp-nav-arrow {
      color: #e8eaed;
      font-size: 16px;
      line-height: 1;
    }

    .cp-nav-row:hover .cp-nav-arrow {
      color: #e8eaed;
    }

    .cp-back {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: none;
      border: none;
      cursor: pointer;
      color: #e8eaed;
      font-size: 24px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .15s, color .15s;
      padding: 0;
    }

    .cp-back:hover {
      background: rgba(255, 255, 255, .1);
      color: #fff;
    }

    .cp-header-title {
      display: flex;
      align-items: center;
      gap: 2  px;
      min-height: 32px;
    }

    #cp-settings-view {
      width: 100%;
      box-sizing: border-box;
      color: #e8eaed;
    }

    #cp-settings-view .cp-title,
    #cp-settings-view .cp-toggle-label,
    #cp-settings-view label {
      color: #e8eaed;
      text-shadow: var(--cp-text-shadow);
    }

    /* color swatches */
    .cp-colors {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .cp-swatch {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform .15s, border-color .15s;
      position: relative;
    }

    .cp-swatch:hover {
      transform: scale(1.12);
    }

    .cp-swatch.active {
      border-color: #fff;
    }

    .cp-swatch.active::after {
      content: '';
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: #fff;
      font-weight: 700;
    }

    /* wallpaper grid */
    .cp-wallpapers {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .cp-wp {
      aspect-ratio: 16/9;
      border-radius: 8px;
      cursor: pointer;
      overflow: hidden;
      transition: transform .15s, filter .15s, box-shadow .15s;
      position: relative;
    }

    .cp-wp:hover {
      transform: scale(1.04);
    }

    .cp-wp.active {
      transform: scale(1.03);
      filter: brightness(1.08);
      box-shadow: 0 0 0 1px rgba(255, 255, 255, .12), 0 4px 14px rgba(0, 0, 0, .35), 0 0 18px rgba(255, 255, 255, .15);
    }

    .cp-wp img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Loading state while a preset fetches / decodes */
    .cp-wp.cp-wp-loading {
      pointer-events: none;
    }

    .cp-wp.cp-wp-loading img {
      opacity: 0.35;
    }

    .cp-wp.cp-wp-loading::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 18px;
      height: 18px;
      margin: -9px 0 0 -9px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      animation: wpe-spin 0.7s linear infinite;
      z-index: 2;
    }

    .cp-wp-label {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(0, 0, 0, .5);
      font-size: 10px;
      color: #fff;
      padding: 3px 5px;
      text-align: center;
    }

    /* upload */
    .cp-upload-btn {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: 1.5px dashed rgba(255, 255, 255, .3);
      background: rgba(255, 255, 255, .08);
      color: #e8eaed;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      transition: background-color .15s, border-color .15s, box-shadow .15s;
      margin-top: 8px;
    }

    .cp-upload-btn:hover {
      background: rgba(255, 255, 255, .16);
      border-color: rgba(255, 255, 255, .65);
      box-shadow: 0 0 10px rgba(255, 255, 255, .08);
    }

    /* shortcuts toggle */
    .cp-toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .cp-toggle-label {
      font-size: 13px;
      color: #e8eaed;
    }

    .toggle {
      width: 40px;
      height: 22px;
      border-radius: 11px;
      background: #5f6368;
      border: none;
      cursor: pointer;
      position: relative;
      transition: background .2s;
      flex-shrink: 0;
    }

    .toggle.on {
      background: #1a73e8;
    }

    .toggle::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #fff;
      transition: transform .2s;
    }

    .toggle.on::after {
      transform: translateX(18px);
    }

    /* ── Modal ── */
    #modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .55);
      backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
      z-index: var(--layer-modal);
    }

    #modal-overlay.open {
      display: flex;
    }

    .modal {
      background: #292a2d;
      border-radius: 16px;
      padding: 28px 32px;
      width: 340px;
      box-shadow: 0 8px 40px rgba(0, 0, 0, .7);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .modal h3 {
      font-size: 17px;
      font-weight: 600;
      color: #e8eaed;
      margin-bottom: 4px;
    }

    .field-label {
      font-size: 12px;
      color: #9aa0a6;
      margin-bottom: -4px;
    }

    .modal input {
      background: #3c4043;
      border: 1px solid #5f6368;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 14px;
      color: #e8eaed;
      outline: none;
      font-family: inherit;
      width: 100%;
      transition: border-color .15s;
    }

    .modal input:focus {
      border-color: #1a73e8;
    }

    .modal input.error {
      border-color: #ea4335;
    }

    .modal-btns {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 6px;
    }

    .mbtn {
      padding: 9px 20px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      font-family: inherit;
      transition: background .15s;
    }

    .mbtn-cancel {
      background: transparent;
      color: #9aa0a6;
    }

    .mbtn-cancel:hover {
      background: rgba(255, 255, 255, .08);
    }

    .mbtn-save {
      background: #1a73e8;
      color: #fff;
    }

    .mbtn-save:hover {
      background: #1765cc;
    }

    /* brightness slider thumb */
    #cp-brightness::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
      transition: transform .15s;
    }

    #cp-brightness::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    #cp-brightness::-moz-range-thumb {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: none;
      background: #fff;
      cursor: pointer;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
    }

    /* ── Drag & Drop ─────────────────────────────────────── */

    /* Tiles are draggable — show grab cursor on long-press area */
    .sc-tile {
      cursor: default;
      user-select: none;
    }

    /* The tile being dragged fades in place */
    .sc-tile.dnd-source {
      opacity: 0.25;
      pointer-events: none;
    }

    /* The floating ghost that follows the cursor */
    #dnd-ghost {
      position: fixed;
      pointer-events: none;
      z-index: var(--layer-dnd-ghost);
      width: 88px;

      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 4px 6px;

      /* 🔥 LIGHT GLASS EFFECT */
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);

      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.08);

      /* 🔥 SOFT SHADOW (not heavy) */
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);

      /* 🔥 LESS AGGRESSIVE FLOAT */
      transform: scale(1.05) rotate(0.5deg);

      opacity: 0.92;
    }

    #dnd-ghost .sc-circle {
      transform: none !important;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4) !important;
    }

    #dnd-ghost .sc-label {
      color: #fff;
      text-shadow: none;
    }

    /* Drop indicator: glowing vertical bar between tiles */
    .sc-tile.dnd-drop-before::before,
    .sc-tile.dnd-drop-after::after {
      content: '';
      position: absolute;
      top: 4px;
      bottom: 4px;
      width: 3px;
      border-radius: 3px;
      background: #1a73e8;
      box-shadow: 0 0 10px rgba(26, 115, 232, 0.9);
      z-index: 20;
    }

    .sc-tile.dnd-drop-before::before {
      left: -3px;
    }

    .sc-tile.dnd-drop-after::after {
      right: -3px;
    }

    /* ══════════════════════════════════════════════
   PREMIUM WALLPAPER EDITOR  (Instagram / Google
   Photos style crop & position editor)
   ══════════════════════════════════════════════ */

    /* Full-screen backdrop */
    #wp-editor-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: var(--layer-wp-editor);
      align-items: center;
      justify-content: center;
    }

    #wp-editor-overlay.open {
      display: flex;
    }

    /* Modal card */
    #wp-editor {
      display: flex;
      flex-direction: column;
      gap: 0;
      width: min(520px, 96vw);
      background: rgba(28, 29, 32, 0.97);
      border-radius: 22px;
      box-shadow: 0 32px 90px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(255, 255, 255, 0.07);
      overflow: hidden;
      animation: wpe-in 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes wpe-in {
      from {
        opacity: 0;
        transform: scale(0.93) translateY(12px);
      }

      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    /* Header */
    #wp-editor-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 20px 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
    }

    #wp-editor-title {
      font-size: 15px;
      font-weight: 600;
      color: #e8eaed;
      letter-spacing: 0.01em;
    }

    #wp-editor-close {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.07);
      border: none;
      cursor: pointer;
      color: #9aa0a6;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, color 0.15s;
    }

    #wp-editor-close:hover {
      background: rgba(255, 255, 255, 0.14);
      color: #e8eaed;
    }

    /* Viewport container — the "frame" that clips the image */
    #wp-editor-viewport-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: #111;
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    #wp-editor-viewport-wrap:active {
      cursor: grabbing;
    }

    #wp-editor-viewport-wrap:focus-visible {
      outline: 2px solid #8ab4f8;
      outline-offset: 2px;
    }

    /* The image (or gif canvas) inside the viewport */
    #wp-editor-img {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: 0 0;
      will-change: transform;
      pointer-events: none;
      max-width: none;
      /* static images */
    }

    #wp-editor-canvas {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: 0 0;
      will-change: transform;
      pointer-events: none;
      display: none;
      /* shown for GIFs */
    }

    /* ── Chrome NTP Safe Zone overlay ── */
    #wpe-safe-zone {
      position: absolute;
      /* Chrome NTP area is roughly 88% wide, 78% tall of full viewport
     accounting for toolbar + tab strip + bookmarks bar */
      top: 7.5%;
      left: 0%;
      width: 100%;
      height: 84%;
      border: 1.5px solid rgba(255, 255, 255, 0.55);
      border-radius: 4px;
      pointer-events: none;
      z-index: 4;
      box-shadow:
        0 0 0 9999px rgba(0, 0, 0, 0.28),
        /* dims outside area */
        inset 0 0 0 1px rgba(255, 255, 255, 0.04);
    }

    /* Corner markers — like a camera viewfinder */
    .wpe-sz-corner {
      position: absolute;
      width: 12px;
      height: 12px;
      border-color: #fff;
      border-style: solid;
      opacity: 0.9;
    }

    .wpe-sz-tl {
      top: -1px;
      left: -1px;
      border-width: 2px 0 0 2px;
    }

    .wpe-sz-tr {
      top: -1px;
      right: -1px;
      border-width: 2px 2px 0 0;
    }

    .wpe-sz-bl {
      bottom: -1px;
      left: -1px;
      border-width: 0 0 2px 2px;
    }

    .wpe-sz-br {
      bottom: -1px;
      right: -1px;
      border-width: 0 2px 2px 0;
    }

    /* Label at top center */
    .wpe-sz-label {
      position: absolute;
      top: -20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 10px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.6);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
      pointer-events: none;
    }

    /* Rule-of-thirds grid overlay (subtle, like Google Photos) */
    #wp-editor-viewport-wrap::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.045) 1px, transparent 1px);
      background-size: 33.333% 33.333%;
      pointer-events: none;
      z-index: 2;
    }

    /* Thin border around viewport frame */
    #wp-editor-viewport-wrap::after {
      content: '';
      position: absolute;
      inset: 0;
      box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, 0.12);
      pointer-events: none;
      z-index: 3;
    }

    /* Controls area */
    #wp-editor-controls {
      padding: 18px 22px 22px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Zoom row */
    .wpe-zoom-row {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .wpe-zoom-label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .wpe-zoom-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #6e7378;
    }

    .wpe-zoom-val {
      font-size: 12px;
      font-weight: 600;
      color: #9aa0a6;
      min-width: 36px;
      text-align: right;
    }

    .wpe-slider-track {
      position: relative;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .wpe-slider-icon {
      font-size: 13px;
      color: #5f6368;
      flex-shrink: 0;
      width: 16px;
      text-align: center;
      line-height: 1;
    }

    #wp-zoom {
      flex: 1;
      height: 3px;
      appearance: none;
      -webkit-appearance: none;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.12);
      outline: none;
      cursor: pointer;
      accent-color: #4ade80;
    }

    #wp-zoom::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
      box-shadow: 0 1px 6px rgba(0, 0, 0, 0.5);
      transition: transform 0.12s;
      border: none;
    }

    #wp-zoom::-webkit-slider-thumb:hover {
      transform: scale(1.18);
    }

    #wp-zoom::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: none;
      background: #fff;
      cursor: pointer;
      box-shadow: 0 1px 6px rgba(0, 0, 0, 0.5);
    }

    /* GIF badge */
    #wpe-gif-badge {
      display: none;
      background: linear-gradient(135deg, #ff6b35, #f7931e);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 3px 8px;
      border-radius: 6px;
      align-self: flex-start;
    }

    #wpe-gif-badge.visible {
      display: inline-block;
    }

    /* Hint text */
    .wpe-hint {
      font-size: 11px;
      color: #4a4d52;
      text-align: center;
    }

    /* Action buttons */
    #wp-editor-btns {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
    }

    #wpe-reset {
      background: none;
      border: none;
      color: #5f6368;
      font-size: 12px;
      cursor: pointer;
      padding: 8px 10px;
      border-radius: 20px;
      font-family: inherit;
      transition: color 0.15s, background 0.15s;
      margin-right: auto;
    }

    #wpe-reset:hover {
      color: #9aa0a6;
      background: rgba(255, 255, 255, 0.05);
    }

    #wpe-cancel {
      background: transparent;
      border: none;
      color: #9aa0a6;
      font-size: 13px;
      font-weight: 500;
      padding: 9px 18px;
      border-radius: 999px;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s;
    }

    #wpe-cancel:hover {
      background: rgba(255, 255, 255, 0.07);
    }

    #wpe-apply {
      background: #1a73e8;
      border: none;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      padding: 9px 22px;
      border-radius: 999px;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s, box-shadow 0.15s;
      box-shadow: 0 2px 10px rgba(26, 115, 232, 0.35);
    }

    #wpe-apply:hover {
      background: #1765cc;
      box-shadow: 0 4px 16px rgba(26, 115, 232, 0.45);
    }

    /* Loading state while the wallpaper exports + caches */
    #wpe-apply:disabled {
      cursor: wait;
      opacity: 0.85;
    }

    #wpe-apply.wpe-loading::before {
      content: '';
      display: inline-block;
      width: 12px;
      height: 12px;
      margin-right: 8px;
      vertical-align: -2px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.35);
      border-top-color: #fff;
      animation: wpe-spin 0.7s linear infinite;
    }

    @keyframes wpe-spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ═══ TAB GROUP MANAGER ═══ */

    /* ── Fixed top bar ── */
    #tgm-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 42px;
      background: rgba(32, 33, 36, 0.20);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 300;
      display: flex;
      align-items: center;
      padding: 0 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.09);
      gap: 8px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
    }

    #tgm-chips-scroll {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      flex: 1;
      scrollbar-width: none;
    }

    #tgm-chips-scroll::-webkit-scrollbar {
      display: none;
    }

    #tgm-bar.tgm-hidden {
      display: none !important;
    }

    /* ── Group chip ── */
    .tgm-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      width: 135px;
      min-width: 135px;
      max-width: 135px;
      box-sizing: border-box;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #e8eaed;
      font-size: 12.5px;
      font-weight: 500;
      font-family: inherit;
      cursor: grab;
      user-select: none;
      white-space: nowrap;
      border-left: 3px solid transparent;
      position: relative;
      flex-shrink: 0;
      touch-action: pan-y;
      transition: transform 0.22s cubic-bezier(0.2, 0, 0, 1),
        background 0.18s cubic-bezier(0.2, 0.8, 0.2, 1),
        border-color 0.18s cubic-bezier(0.2, 0.8, 0.2, 1),
        box-shadow 0.18s cubic-bezier(0.2, 0.8, 0.2, 1),
        opacity 0.18s ease;
      will-change: transform;
    }

    .tgm-chip:active {
      cursor: grabbing;
    }

    .tgm-chip.tgm-pointer-dragging {
      cursor: grabbing !important;
      z-index: 20 !important;
      transition: none !important;
      background: rgba(255, 255, 255, 0.2) !important;
      border-color: rgba(255, 255, 255, 0.35) !important;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5), 0 0 0 1.5px rgba(255, 255, 255, 0.3) !important;
      opacity: 0.95;
    }

    .tgm-chip.tgm-dragging {
      opacity: 0.35;
      transform: scale(0.94);
      cursor: grabbing;
      transition: opacity 0.15s ease, transform 0.15s ease;
    }

    .tgm-chip.tgm-drag-target {
      box-shadow: 0 0 0 2px #8ab4f8, 0 4px 16px rgba(138, 180, 248, 0.35);
    }

    .tgm-chip:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.25);
      transform: none;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
    }

    #tgm-chips-scroll.tgm-is-dragging {
      user-select: none;
    }

    #tgm-chips-scroll.tgm-is-dragging .tgm-chip:not(.tgm-pointer-dragging):hover {
      transform: none;
      box-shadow: none;
    }

    .tgm-chip.tgm-active {
      border-left-width: 3px;
      border-left-style: solid;
    }

    .tgm-chip.tgm-active {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.35);
      box-shadow: 0 2px 14px rgba(0, 0, 0, 0.25);
    }

    .tgm-chip-name {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: left;
    }

    .tgm-chip-badge {
      font-size: 8px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      padding: 1px 4px;
      border-radius: 5px;
      background: rgba(52, 168, 83, 0.28);
      border: 1px solid rgba(52, 168, 83, 0.4);
      color: #81c995;
      margin-left: 2px;
      flex-shrink: 0;
    }

    .tgm-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
      box-shadow: 0 0 6px currentColor;
    }

    .tgm-arrow {
      font-size: 9px;
      opacity: 0.55;
      margin-left: 1px;
      flex-shrink: 0;
    }

    /* ── [+] New-group button ── */
    #tgm-add-btn {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: #e8eaed;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.18s ease;
      font-family: inherit;
      line-height: 1;
      padding: 0;
    }

    #tgm-add-btn:hover {
      background: rgba(255, 255, 255, 0.20);
      border-color: rgba(255, 255, 255, 0.35);
      transform: scale(1.08);
    }

    /* ── Dropdown panel ── */
    .tgm-dropdown {
      position: fixed;
      background: rgba(32, 33, 36, 0.4);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55), 0 2px 8px rgba(0, 0, 0, 0.35);
      width: 320px;
      min-width: 320px;
      max-width: 320px;
      box-sizing: border-box;
      max-height: 420px;
      overflow: hidden;
      z-index: 400;
      display: none;
      flex-direction: column;
      animation: tgmDdIn 0.16s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      transform-origin: top left;
    }

    @keyframes tgmDdIn {
      from {
        opacity: 0;
        transform: translateY(-6px) scale(0.97);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .tgm-dropdown.tgm-dd-open {
      display: flex;
    }

    /* Dropdown header */
    .tgm-dd-header {
      display: flex;
      align-items: center;
      padding: 12px 14px;
      gap: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      flex-shrink: 0;
    }

    .tgm-dd-title-wrap {
      display: flex;
      align-items: center;
      gap: 7px;
      flex: 1;
      min-width: 0;
    }

    .tgm-dd-name {
      font-size: 13.5px;
      font-weight: 600;
      color: #f1f3f4;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: 0.1px;
    }

    /* Active status toggle button */
    .tgm-active-toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.06);
      color: #9aa0a6;
      transition: all 0.15s ease;
      flex-shrink: 0;
      user-select: none;
      font-family: inherit;
    }

    .tgm-active-toggle:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #e8eaed;
      border-color: rgba(255, 255, 255, 0.25);
    }

    /* Play / pause toggle: both states are the same compact circle */
    .tgm-active-toggle.is-play,
    .tgm-active-toggle.is-active {
      width: 26px;
      height: 26px;
      padding: 0;
      border-radius: 50%;
      justify-content: center;
    }

    .tgm-active-toggle.is-play svg,
    .tgm-active-toggle.is-active svg {
      display: block;
      pointer-events: none;
    }

    .tgm-active-toggle.is-play {
      color: #bdc1c6;
    }

    .tgm-active-toggle.is-play:hover {
      background: rgba(52, 168, 83, 0.18);
      border-color: rgba(52, 168, 83, 0.6);
      color: #81c995;
      transform: scale(1.06);
    }

    .tgm-active-toggle.is-play:active {
      transform: scale(0.94);
    }

    .tgm-active-toggle.is-active {
      background: rgba(52, 168, 83, 0.18);
      border-color: rgba(52, 168, 83, 0.6);
      color: #81c995;
      box-shadow: 0 0 10px rgba(52, 168, 83, 0.14);
    }

    .tgm-active-toggle.is-active:hover {
      background: rgba(255, 152, 0, 0.18);
      border-color: rgba(255, 152, 0, 0.55);
      color: #ffb74d;
      box-shadow: 0 0 10px rgba(255, 152, 0, 0.14);
      transform: scale(1.06);
    }

    .tgm-active-toggle.is-active:active {
      transform: scale(0.94);
    }

    .tgm-dd-hbtn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      cursor: pointer;
      color: #9aa0a6;
      width: 26px;
      height: 26px;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      flex-shrink: 0;
      font-family: inherit;
      padding: 0;
    }

    .tgm-dd-hbtn:hover {
      background: rgba(255, 255, 255, 0.14);
      color: #f1f3f4;
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-1px);
    }

    .tgm-dd-hbtn.tgm-dd-hbtn-del:hover {
      background: rgba(234, 67, 53, 0.2);
      color: #f28b82;
      border-color: rgba(234, 67, 53, 0.4);
    }

    /* Tab list */
    .tgm-dd-tabs {
      display: flex;
      flex-direction: column;
      flex: 1;
      overflow-y: auto;
      padding: 6px 8px;
      max-height: 250px;
    }

    .tgm-dd-tabs::-webkit-scrollbar {
      width: 4px;
    }

    .tgm-dd-tabs::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.18);
      border-radius: 2px;
    }

    .tgm-tab-row {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 0 10px;
      height: 36px;
      box-sizing: border-box;
      margin: 1px 0;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      transition: background 0.12s ease, transform 0.12s ease;
    }

    .tgm-tab-row:hover {
      background: rgba(255, 255, 255, 0.08);
      transform: translateX(2px);
    }

    .tgm-tab-favicon {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .tgm-tab-title {
      flex: 1;
      font-size: 12px;
      font-weight: 450;
      color: #e8eaed;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.3;
    }

    .tgm-tab-remove {
      background: transparent;
      border: none;
      cursor: pointer;
      color: #9aa0a6;
      width: 20px;
      height: 20px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      opacity: 0;
      transform: scale(0.85);
      transition: opacity 0.12s ease, background 0.12s ease, transform 0.12s ease, color 0.12s ease;
      font-family: inherit;
      padding: 0;
    }

    .tgm-tab-row:hover .tgm-tab-remove {
      opacity: 0.7;
      transform: scale(1);
    }

    .tgm-tab-remove:hover {
      opacity: 1 !important;
      background: rgba(234, 67, 53, 0.22);
      color: #f28b82;
      transform: scale(1.08) !important;
    }

    /* Empty State */
    .tgm-dd-empty {
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-align: center;
      color: rgba(255, 255, 255, 0.35);
    }

    .tgm-empty-title {
      font-size: 12.5px;
      font-weight: 500;
      color: #9aa0a6;
    }

    /* Action buttons */
    .tgm-dd-actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      padding: 10px 12px 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      flex-shrink: 0;
    }

    .tgm-btn-open,
    .tgm-btn-new-win,
    .tgm-btn-close {
      width: 100%;
      height: 33px;
      box-sizing: border-box;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      border-radius: 8px;
      padding: 0 4px;
      font-size: 11px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.14s ease;
      white-space: nowrap;
    }

    .tgm-btn-open {
      background: rgba(26, 115, 232, 0.85);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 2px 8px rgba(26, 115, 232, 0.28);
    }

    .tgm-btn-open:hover {
      background: #1a73e8;
      box-shadow: 0 4px 14px rgba(26, 115, 232, 0.45);
      transform: translateY(-1px);
    }

    .tgm-btn-new-win {
      background: rgba(255, 255, 255, 0.07);
      color: #d1d5db;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .tgm-btn-new-win:hover {
      background: rgba(255, 255, 255, 0.14);
      color: #fff;
      border-color: rgba(255, 255, 255, 0.22);
      transform: translateY(-1px);
    }

    .tgm-btn-close {
      background: rgba(255, 255, 255, 0.07);
      color: #d1d5db;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .tgm-btn-close:hover {
      background: rgba(234, 67, 53, 0.18);
      border-color: rgba(234, 67, 53, 0.35);
      color: #f28b82;
      transform: translateY(-1px);
    }

    /* ── Note Chip Badge ── */
    .tgm-chip-badge-note {
      background: rgba(251, 188, 4, 0.22) !important;
      border: 1px solid rgba(251, 188, 4, 0.45) !important;
      color: #fdd663 !important;
    }

    /* ── Note Dropdown Panel ── */
    .tgm-dropdown.tgm-dropdown-note {
      width: 340px;
      min-width: 340px;
      max-width: 340px;
      max-height: 480px;
    }

    .tgm-note-mode-toggle {
      display: inline-flex;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      padding: 2px;
      gap: 2px;
      margin-left: auto;
      flex-shrink: 0;
    }

    .tgm-note-mode-btn {
      background: transparent;
      border: none;
      color: #9aa0a6;
      font-size: 11px;
      font-weight: 500;
      font-family: inherit;
      padding: 3px 8px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .tgm-note-mode-btn.active {
      background: rgba(255, 255, 255, 0.18);
      color: #ffffff;
      font-weight: 600;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
    }

    .tgm-dd-delete-btn:hover {
      background: rgba(234, 67, 53, 0.2) !important;
      border-color: rgba(234, 67, 53, 0.4) !important;
      color: #f28b82 !important;
    }

    /* ── Note Body ── */
    .tgm-note-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 180px;
      max-height: 360px;
    }

    .tgm-note-checklist-wrap {
      display: flex;
      flex-direction: column;
      flex: 1;
      overflow: hidden;
    }

    .tgm-note-items-list {
      flex: 1;
      overflow-y: auto;
      padding: 6px 8px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.15) transparent;
    }

    .tgm-note-empty-notice {
      text-align: center;
      padding: 24px 12px;
      font-size: 12.5px;
      color: rgba(255, 255, 255, 0.38);
      font-style: italic;
    }

    .tgm-checklist-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 8px;
      border-radius: 8px;
      transition: background 0.12s ease;
    }

    .tgm-checklist-item:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    .tgm-checklist-cb {
      width: 15px;
      height: 15px;
      cursor: pointer;
      accent-color: #8ab4f8;
      border-radius: 4px;
      flex-shrink: 0;
    }

    .tgm-checklist-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #e8eaed;
      font-family: inherit;
      font-size: 13px;
      padding: 2px 0;
      min-width: 0;
    }

    .tgm-checklist-item.done .tgm-checklist-input {
      text-decoration: line-through;
      color: #9aa0a6;
      opacity: 0.6;
    }

    .tgm-checklist-del {
      opacity: 0;
      background: transparent;
      border: none;
      color: #9aa0a6;
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      padding: 2px 6px;
      border-radius: 4px;
      transition: all 0.15s;
      flex-shrink: 0;
    }

    .tgm-checklist-item:hover .tgm-checklist-del {
      opacity: 0.8;
    }

    .tgm-checklist-del:hover {
      opacity: 1 !important;
      color: #f28b82;
      background: rgba(234, 67, 53, 0.18);
    }

    .tgm-checklist-add-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-top: 1px dashed rgba(255, 255, 255, 0.1);
      background: rgba(0, 0, 0, 0.12);
      flex-shrink: 0;
    }

    .tgm-checklist-add-icon {
      color: #8ab4f8;
      font-size: 16px;
      font-weight: 600;
      width: 15px;
      text-align: center;
      line-height: 1;
      flex-shrink: 0;
    }

    .tgm-checklist-add-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #e8eaed;
      font-family: inherit;
      font-size: 13px;
    }

    .tgm-checklist-add-input::placeholder {
      color: rgba(255, 255, 255, 0.35);
    }

    /* ── Text mode view ── */
    .tgm-note-text-wrap {
      flex: 1;
      display: flex;
      padding: 4px;
    }

    .tgm-note-textarea {
      flex: 1;
      width: 100%;
      min-height: 170px;
      max-height: 320px;
      background: transparent;
      border: none;
      outline: none;
      color: #e8eaed;
      font-family: inherit;
      font-size: 13.5px;
      line-height: 1.55;
      padding: 10px 12px;
      resize: vertical;
      box-sizing: border-box;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.15) transparent;
    }

    .tgm-note-textarea::placeholder {
      color: rgba(255, 255, 255, 0.35);
    }

    /* ── Note Footer ── */
    .tgm-note-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 11.5px;
      color: #9aa0a6;
      background: rgba(0, 0, 0, 0.2);
      flex-shrink: 0;
    }

    .tgm-note-saved-status {
      display: flex;
      align-items: center;
      gap: 4px;
      color: #81c995;
      font-size: 11.5px;
      opacity: 0.9;
      transition: opacity 0.2s ease;
      user-select: none;
    }

    .tgm-note-footer-btns {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tgm-note-btn {
      height: 25px;
      box-sizing: border-box;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #e8eaed;
      font-family: inherit;
      font-size: 11px;
      font-weight: 500;
      padding: 0 9px;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: all 0.15s ease;
      white-space: nowrap;
      user-select: none;
    }

    .tgm-note-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.25);
    }

    .tgm-note-btn.tgm-note-btn-clear:hover {
      background: rgba(234, 67, 53, 0.2);
      color: #f28b82;
      border-color: rgba(234, 67, 53, 0.45);
    }

    /* ── Modal Type Slider (Segmented Switch) ── */
    .tgm-type-slider {
      display: flex;
      position: relative;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 3px;
      gap: 0;
      user-select: none;
      margin-bottom: 4px;
    }

    .tgm-slider-pill {
      position: absolute;
      top: 3px;
      bottom: 3px;
      left: 3px;
      width: calc(50% - 3px);
      background: rgba(255, 255, 255, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.24);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
      border-radius: 9px;
      transition: transform 0.24s cubic-bezier(0.2, 0, 0, 1);
      pointer-events: none;
    }

    .tgm-type-slider.is-notes .tgm-slider-pill {
      transform: translateX(100%);
    }

    .tgm-slider-btn {
      flex: 1;
      position: relative;
      z-index: 1;
      background: transparent;
      border: none;
      color: #9aa0a6;
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 500;
      padding: 8px 12px;
      border-radius: 9px;
      cursor: pointer;
      transition: color 0.18s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .tgm-slider-btn.active {
      color: #ffffff;
      font-weight: 600;
    }

    .tgm-slider-btn:hover:not(.active) {
      color: #e8eaed;
    }

    /* ── TGM modals ── */
    #tgm-modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    #tgm-modal-overlay.open {
      display: flex;
    }

    .tgm-modal {
      background: rgba(32, 33, 36, 0.82);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 16px;
      padding: 24px 28px;
      width: 380px;
      max-width: 92vw;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(255, 255, 255, 0.06);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .tgm-modal h3 {
      font-size: 16px;
      font-weight: 600;
      color: #e8eaed;
      margin: 0;
    }

    .tgm-modal input {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 14px;
      color: #e8eaed;
      outline: none;
      font-family: inherit;
      width: 100%;
      box-sizing: border-box;
      transition: all 0.15s;
    }

    .tgm-modal input:focus {
      background: rgba(255, 255, 255, 0.12);
      border-color: #8ab4f8;
      box-shadow: 0 0 0 2px rgba(138, 180, 248, 0.25);
    }

    @keyframes tgm-shake {
      0%, 100% { transform: translateX(0); }
      20%      { transform: translateX(-6px); }
      40%      { transform: translateX(6px); }
      60%      { transform: translateX(-4px); }
      80%      { transform: translateX(4px); }
    }

    .tgm-modal input.tgm-invalid,
    .tgm-modal input.tgm-invalid:focus {
      border-color: #ea4335;
      box-shadow: 0 0 0 2px rgba(234, 67, 53, 0.18);
      animation: tgm-shake 0.4s ease;
    }

    .tgm-modal-btns {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 4px;
    }

    .tgm-mbtn-cancel {
      background: transparent;
      color: #9aa0a6;
      border: none;
      padding: 9px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s;
    }

    .tgm-mbtn-cancel:hover {
      background: rgba(255, 255, 255, 0.09);
      color: #e8eaed;
    }

    .tgm-mbtn-save {
      background: rgba(26, 115, 232, 0.9);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.18);
      padding: 9px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s;
    }

    .tgm-mbtn-save:hover {
      background: #1765cc;
    }

    .tgm-confirm-text {
      font-size: 13px;
      color: #9aa0a6;
      margin: 0;
    }

    .tgm-mbtn-delete {
      background: rgba(234, 67, 53, 0.9);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.18);
      padding: 9px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s;
    }

    .tgm-mbtn-delete:hover {
      background: #c5221f;
    }

    /* ── TGM Group Color Picker ── */
    .tgm-color-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tgm-color-label {
      font-size: 11px;
      color: #9aa0a6;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      width: 100%;
      margin-bottom: 2px;
    }

    .tgm-color-swatch {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2.5px solid transparent;
      cursor: pointer;
      flex-shrink: 0;
      padding: 0;
      outline: none;
      background-clip: padding-box;
      transition: transform 0.15s cubic-bezier(.2,0,0,1),
                  box-shadow 0.15s ease,
                  border-color 0.15s ease;
    }

    .tgm-color-swatch:hover {
      transform: scale(1.18);
      box-shadow: 0 0 0 3px rgba(255,255,255,0.22);
    }

    .tgm-color-swatch.selected {
      border-color: #fff;
      box-shadow: 0 0 0 3px rgba(255,255,255,0.4);
      transform: scale(1.14);
    }

    /* Inner ring keeps pure white/black swatches visible on the dark modal */
    .tgm-color-swatch.tgm-swatch-ring {
      outline: 2px solid rgba(255, 255, 255, 0.45);
      outline-offset: -3px;
    }

    /* 7th swatch: conic-gradient rainbow */
    .tgm-color-custom-btn {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: conic-gradient(
        hsl(0,100%,60%), hsl(30,100%,60%), hsl(60,100%,55%),
        hsl(90,100%,55%), hsl(120,100%,55%), hsl(150,100%,55%),
        hsl(180,100%,55%), hsl(210,100%,60%), hsl(240,100%,65%),
        hsl(270,100%,65%), hsl(300,100%,60%), hsl(330,100%,60%),
        hsl(360,100%,60%)
      );
      background-clip: padding-box;
      border: 2.5px solid rgba(255,255,255,0.22);
      cursor: pointer;
      flex-shrink: 0;
      padding: 0;
      outline: none;
      transition: transform 0.15s cubic-bezier(.2,0,0,1), box-shadow 0.15s ease;
    }

    .tgm-color-custom-btn:hover {
      transform: scale(1.18);
      box-shadow: 0 0 0 3px rgba(255,255,255,0.22);
    }

    .tgm-color-custom-btn.active {
      border-color: #fff;
      box-shadow: 0 0 0 3px rgba(255,255,255,0.4);
      transform: scale(1.12);
    }

    /* HSL wheel container */
    .tgm-hsl-wrap {
      display: none;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      padding: 12px 14px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      box-sizing: border-box;
    }

    .tgm-hsl-wrap.open {
      display: flex;
    }

    .tgm-hsl-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .tgm-hsl-row label {
      font-size: 11px;
      color: #9aa0a6;
      font-weight: 500;
      width: 12px;
      flex-shrink: 0;
      text-align: center;
    }

    .tgm-hsl-slider {
      flex: 1;
      height: 7px;
      border-radius: 4px;
      outline: none;
      border: none;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
    }

    .tgm-hsl-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid rgba(0,0,0,0.35);
      cursor: pointer;
      box-shadow: 0 1px 4px rgba(0,0,0,0.45);
    }

    #tgm-hsl-hue {
      background: linear-gradient(to right,
        hsl(0,100%,55%), hsl(30,100%,55%), hsl(60,100%,50%),
        hsl(90,100%,50%), hsl(120,100%,50%), hsl(150,100%,50%),
        hsl(180,100%,50%), hsl(210,100%,55%), hsl(240,100%,60%),
        hsl(270,100%,60%), hsl(300,100%,55%), hsl(330,100%,55%),
        hsl(360,100%,55%)
      );
    }

    .tgm-hsl-preview {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.3);
      flex-shrink: 0;
      transition: background 0.1s ease;
    }

    /* Open Tab Picker list in Modal */
    .tgm-picker-section {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 4px;
    }

    .tgm-picker-title {
      font-size: 12px;
      color: #9aa0a6;
      font-weight: 500;
    }

    .tgm-picker-list {
      max-height: 150px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .tgm-picker-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }

    .tgm-picker-item:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.18);
    }

    .tgm-picker-fav {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      border-radius: 2px;
    }

    .tgm-picker-text {
      flex: 1;
      font-size: 12px;
      color: #e8eaed;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Toast */
    .tgm-toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(32, 33, 36, 0.82);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      color: #e8eaed;
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      padding: 10px 22px;
      border-radius: 24px;
      font-size: 13px;
      font-weight: 500;
      z-index: 100000;
      opacity: 0;
      transition: transform 0.25s cubic-bezier(0.2, 0, 0, 1), opacity 0.25s ease;
      pointer-events: none;
    }

    .tgm-toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
